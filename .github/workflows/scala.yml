name: Scala CI

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 11
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 11
    - uses: sbt/setup-sbt@v1
    - name: Run tests
      run: sbt -v test
